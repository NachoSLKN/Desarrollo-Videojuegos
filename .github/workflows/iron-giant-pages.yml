name: Deploy Iron Giant GDD
on:
  push:
    branches: [main]
    paths:
      - 'UNITY/IRON GIANT/Web/**'
      - '.github/workflows/iron-giant-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: 'UNITY/IRON GIANT/Web/package-lock.json'
      - name: Build GDD
        working-directory: 'UNITY/IRON GIANT/Web'
        run: |
          npm ci
          npm run build
      - name: Prepare Pages directory
        run: |
          mkdir -p "publish/UNITY/IRON GIANT"
          cp -a "UNITY/IRON GIANT/Web/dist/." "publish/UNITY/IRON GIANT/"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
